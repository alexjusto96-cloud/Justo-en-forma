<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Sesión</title>

  <style>
    /* ==========================================
       VARIABLES Y CONFIGURACIÓN GLOBAL
       ========================================== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ==========================================
       CONTENEDOR PRINCIPAL
       ========================================== */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      text-align: center;
    }

    /* ==========================================
       FORMULARIO E INPUTS
       ========================================== */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    label {
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input, 
    select, 
    textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, 
    select:focus, 
    textarea:focus {
      border-color: var(--primary);
    }

    /* Estilo auxiliar para los sub-elementos de tipo */
    .sub-input {
      margin-bottom: 8px;
    }

    /* Grupo de tiempo / campos dobles */
    .time-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-group input {
      flex: 1;
      text-align: center;
    }

    /* ==========================================
       BOTÓN Y MENSAJES DE ESTADO
       ========================================== */
    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    /* Clases de utilidad */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <main class="container">
    <h2>Registro de Sesión</h2>

    <form id="rpeForm">
      
      <!-- Modalidad (Solo Cardio) -->
      <div id="grp-modalidad" class="form-group hidden">
        <label for="modalidad">Modalidad</label>
        <select id="modalidad">
          <!-- Opciones dinámicas cargadas desde JS -->
        </select>
      </div>

      <!-- Tipo de Entrenamiento / Bloque -->
      <div id="grp-tipo" class="form-group hidden">
        <label id="lbl-tipo" for="tipo">Tipo de Entrenamiento</label>
        
        <!-- 1. Buscador del ListPicker -->
        <input type="text" id="search-tipo" class="sub-input" placeholder="🔍 Buscar entrenamiento...">
        
        <!-- 2. Catálogo de opciones desplegado -->
        <select id="tipo" size="5" class="sub-input"></select>
        
        <!-- 3. Campo de texto final (al seleccionar toma el valor o permite escribir un tipo nuevo) -->
        <label for="tipo-texto" style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Valor que se registrará:</label>
        <input type="text" id="tipo-texto" placeholder="Escribe o selecciona un entrenamiento">
      </div>

      <!-- Kilometraje -->
      <div id="grp-kilometraje" class="form-group hidden">
        <label id="lbl-kilometraje" for="kilometraje">Kilometraje (km)</label>
        <input type="text" id="kilometraje" placeholder="Ej: 10,5">
      </div>

      <!-- Pulso Medio -->
      <div id="grp-pulso" class="form-group hidden">
        <label for="pulso">Pulso Medio (ppm)</label>
        <input type="number" id="pulso" placeholder="Ej: 145">
      </div>

      <!-- Intensidad PP (Minutos y Segundos) -->
      <div id="grp-intensidad" class="form-group hidden">
        <label id="lbl-inten">Intensidad PP</label>
        <div class="time-group">
          <input type="number" id="min" placeholder="Min / Watios">
          <span id="delimiter-seg" class="hidden">:</span>
          <input type="number" id="seg" class="hidden" placeholder="Seg">
        </div>
      </div>

      <!-- Comentarios Opcionales -->
      <div class="form-group">
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" rows="3" placeholder="Sensaciones, observaciones..."></textarea>
      </div>

      <button type="submit" id="btnEnviar">Enviar Registro</button>
    </form>
    
    <div id="statusMessage"></div>
  </main>

  <script src="rpe2.js"></script>
</body>
</html>
