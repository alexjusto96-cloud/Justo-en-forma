<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Fuerza-Velocidad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #444;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #0066cc;
    }

    .grid-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 16px 0;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0066cc;
      cursor: pointer;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      background-color: #e0e0e0;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: #d0d0d0;
    }

    .btn-main {
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }

    .btn-main:hover {
      background-color: #0052a3;
    }

    .results-card {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      padding: 12px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      text-align: center;
    }

    .results-card div {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .results-card .title {
      font-size: 0.85rem;
      color: #666;
      font-weight: 600;
    }

    .results-card .value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0066cc;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <iframe id="webViewer1" class="hidden" src="about:blank"></iframe>

    <div class="form-group">
      <select id="listPicker1">
        <option value="" disabled selected>Selecciona ejercicio</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="textBox11" placeholder="Ejercicio seleccionado">
    </div>

    <!-- Cargas y Velocidades (textBox1 a textBox10) -->
    <div class="grid-pair">
      <div>
        <label for="textBox1">Carga 1</label>
        <input type="number" id="textBox1" step="any">
      </div>
      <div>
        <label for="textBox2">VMP 1</label>
        <input type="number" id="textBox2" step="any">
      </div>
    </div>

    <div class="grid-pair">
      <div>
        <label for="textBox3">Carga 2</label>
        <input type="number" id="textBox3" step="any">
      </div>
      <div>
        <label for="textBox4">VMP 2</label>
        <input type="number" id="textBox4" step="any">
      </div>
    </div>

    <div class="grid-pair">
      <div>
        <label for="textBox5">Carga 3</label>
        <input type="number" id="textBox5" step="any">
      </div>
      <div>
        <label for="textBox6">VMP 3</label>
        <input type="number" id="textBox6" step="any">
      </div>
    </div>

    <div class="grid-pair">
      <div>
        <label for="textBox7">Carga 4</label>
        <input type="number" id="textBox7" step="any">
      </div>
      <div>
        <label for="textBox8">VMP 4</label>
        <input type="number" id="textBox8" step="any">
      </div>
    </div>

    <div class="grid-pair">
      <div>
        <label for="textBox9">Carga 5</label>
        <input type="number" id="textBox9" step="any">
      </div>
      <div>
        <label for="textBox10">VMP 5</label>
        <input type="number" id="textBox10" step="any">
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="checkBox1">
      <label for="checkBox1">Test Máximo</label>
    </div>

    <div class="button-row">
      <button id="button1" class="btn">Consultar</button>
      <button id="button3" class="btn">Menu Principal</button>
    </div>

    <div class="results-card">
      <div>
        <span class="title">Best</span>
        <span id="mejorText" class="value">-</span>
      </div>
      <div>
        <span class="title">V1RM</span>
        <span id="v1rmText" class="value">-</span>
      </div>
    </div>

    <button id="button2" class="btn btn-main">Grabar</button>
  </div>

  <script src="PerfilFV.js"></script>
</body>
</html>
