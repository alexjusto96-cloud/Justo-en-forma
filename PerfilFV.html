<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Fuerza-Velocidad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .hidden {
      display: none;
    }
    .results {
      margin-top: 16px;
      padding: 12px;
      background-color: #f0f0f0;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Perfil Fuerza-Velocidad</h2>

  <!-- WebViewer / iframe (Oculto por defecto) -->
  <iframe id="webViewer1" class="hidden" src="about:blank"></iframe>

  <div class="form-group">
    <label for="listPicker1">Seleccionar Ejercicio:</label>
    <select id="listPicker1">
      <option value="" disabled selected>Elige un ejercicio</option>
    </select>
  </div>

  <div class="form-group">
    <label for="textBox11">Ejercicio Seleccionado:</label>
    <input type="text" id="textBox11" readonly>
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" id="checkBox1"> Opciones avanzadas
    </label>
  </div>

  <button id="button2">Guardar Datos</button>

  <div class="results">
    <p><strong>Mejor:</strong> <span id="mejorText">-</span></p>
    <p><strong>R2:</strong> <span id="r2Text">-</span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
