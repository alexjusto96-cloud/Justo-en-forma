<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPE - Registro de Entrenamiento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="form-card">
      <h2>Registro RPE</h2>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" class="input-field" placeholder="Nombre del atleta">
      </div>

      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" class="input-field">
      </div>

      <div class="form-group">
        <label for="estatus">Estatus</label>
        <select id="estatus" class="input-field">
          <option value="Completo">Completo</option>
          <option value="Limitado">Limitado</option>
          <option value="Lesionado">Lesionado</option>
        </select>
      </div>

      <div class="form-group">
        <label for="duracion">Duración (min)</label>
        <input type="number" id="duracion" class="input-field" placeholder="Ej: 60">
      </div>

      <div class="form-group">
        <label for="rpe">RPE (0-10)</label>
        <select id="rpe" class="input-field">
          <option value="">Selecciona RPE</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>

      <div class="form-group">
        <label for="entrenamiento">Entrenamiento</label>
        <select id="entrenamiento" class="input-field">
          <option value="">Selecciona tipo</option>
          <option value="Cardio">Cardio</option>
          <option value="Fuerza">Fuerza</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <button id="btnSiguiente" class="btn-primary">Siguiente</button>
    </div>
  </div>

  <script src="rpe.js"></script>
</body>
</html>
