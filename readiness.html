<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Readiness - Justo en Forma</title>
  <meta name="theme-color" content="#1e3a8a">
</head>
<body>
  <header class="app-header">
    <h1>Readiness</h1>
    <span id="user-display" class="user-badge"></span>
  </header>

  <main class="main-content">
    <div class="card">
      <form id="readiness-form">

        <!-- Estado Muscular (Rojo a Verde) -->
        <div class="slider-group">
          <div class="slider-header">
            <label for="soreness">Estado muscular</label>
            <span id="val-soreness" class="slider-value">5</span>
          </div>
          <input 
            type="range" 
            id="soreness" 
            min="0" 
            max="10" 
            value="5" 
            data-type="good-right"
            style="-webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; outline: none;"
          >
        </div>

        <!-- Energía / Fatiga (Rojo a Verde) -->
        <div class="slider-group">
          <div class="slider-header">
            <label for="fatiga">Energía</label>
            <span id="val-fatiga" class="slider-value">5</span>
          </div>
          <input 
            type="range" 
            id="fatiga" 
            min="0" 
            max="10" 
            value="5" 
            data-type="good-right"
            style="-webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; outline: none;"
          >
        </div>

        <!-- Calidad de Sueño (Rojo a Verde) -->
        <div class="slider-group">
          <div class="slider-header">
            <label for="sueno">Calidad de sueño</label>
            <span id="val-sueno" class="slider-value">5</span>
          </div>
          <input 
            type="range" 
            id="sueno" 
            min="0" 
            max="10" 
            value="5" 
            data-type="good-right"
            style="-webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; outline: none;"
          >
        </div>

        <!-- Estrés (Verde a Rojo - Invertido) -->
        <div class="slider-group">
          <div class="slider-header">
            <label for="estres">Estrés</label>
            <span id="val-estres" class="slider-value">5</span>
          </div>
          <input 
            type="range" 
            id="estres" 
            min="0" 
            max="10" 
            value="5" 
            data-type="good-left"
            style="-webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 5px; outline: none;"
          >
        </div>

        <!-- Horas de Sueño -->
        <div class="form-group">
          <label for="horas">Horas de sueño</label>
          <div class="input-wrapper">
            <input type="number" id="horas" step="0.1" placeholder="Ej. 7.5">
            <span class="input-unit">hs</span>
          </div>
        </div>

        <!-- HRV -->
        <div class="form-group">
          <label for="hrv">HRV</label>
          <div class="input-wrapper">
            <input type="number" id="hrv" step="1" placeholder="Ej. 65">
            <span class="input-unit">ms</span>
          </div>
        </div>

        <!-- Peso -->
        <div class="form-group">
          <label for="peso">Peso</label>
          <div class="input-wrapper">
            <input type="number" id="peso" step="0.1" placeholder="Ej. 70.5">
            <span class="input-unit">kg</span>
          </div>
        </div>

        <!-- Observaciones -->
        <div class="form-group">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" rows="3" placeholder="Añade algún comentario sobre cómo te sientes hoy..."></textarea>
        </div>

        <div class="button-group">
          <button type="button" id="btn-atras" class="btn-secondary">Atrás</button>
          <button type="submit" id="btn-enviar" class="btn-primary">Enviar</button>
        </div>
      </form>
    </div>
  </main>

  <!-- LÓGICA JAVASCRIPT COMPLETA -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sliders = document.querySelectorAll('input[type="range"]');

      // Función para pintar el fondo de cada slider y actualizar su número
      function updateSlider(slider) {
        const valSpan = document.getElementById(`val-${slider.id}`);
        if (valSpan) {
          valSpan.textContent = slider.value;
        }

        const isGoodRight = slider.getAttribute('data-type') === 'good-right';
        
        // Asignamos el degradado según si la derecha es buena (rojo a verde) o mala (verde a rojo)
        if (isGoodRight) {
          slider.style.background = 'linear-gradient(to right, #ef4444, #eab308, #22c55e)';
        } else {
          slider.style.background = 'linear-gradient(to right, #22c55e, #eab308, #ef4444)';
        }
      }

      // Inicializar todos los sliders al cargar la página
      sliders.forEach(slider => {
        updateSlider(slider);

        // Escuchar cuando el usuario arrastre el slider
        slider.addEventListener('input', (e) => {
          updateSlider(e.target);
        });
      });

      // Manejo del envío del formulario
      const form = document.getElementById('readiness-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const formData = {
          soreness: document.getElementById('soreness').value,
          fatiga: document.getElementById('fatiga').value,
          sueno: document.getElementById('sueno').value,
          estres: document.getElementById('estres').value,
          horas: document.getElementById('horas').value,
          hrv: document.getElementById('hrv').value,
          peso: document.getElementById('peso').value,
          observaciones: document.getElementById('observaciones').value
        };

        console.log('Datos guardados:', formData);
      });
    });
  </script>
</body>
</html>
