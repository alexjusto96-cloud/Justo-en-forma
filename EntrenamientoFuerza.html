<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenamiento Fuerza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Registro de Entrenamiento de Fuerza</h2>

  <div class="form-group">
    <label for="listPicker1">Seleccionar ejercicio:</label>
    <input type="text" id="buscadorEjercicio" placeholder="Buscar ejercicio..." style="margin-bottom: 6px;">
    <select id="listPicker1"></select>
  </div>

  <div class="form-group">
    <label for="ejercicio">Ejercicio:</label>
    <input type="text" id="ejercicio" placeholder="Nombre del ejercicio">
  </div>

  <div class="nav-banner">
    <button id="btnTextPrev" class="btn-secundario">&larr;</button>
    <span id="navTextDisplay">Texto 1 de 3</span>
    <button id="btnTextNext" class="btn-secundario">&rarr;</button>
  </div>

  <div class="form-group">
    <button id="consultar" style="width: 100%;" class="btn-secundario">Consultar últimos entrenamientos</button>
  </div>

  <div class="form-group tempo-inline">
    <label class="checkbox-inline">
      <input type="checkbox" id="vbt"> VBT
    </label>
    <span>Tempo:</span>
    <span>Con</span><select id="con"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    <span>P.Con</span><select id="pausaCon"><option value="1">0</option><option value="2">1</option></select>
    <span>Exc</span><select id="ecc"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
    <span>P.Exc</span><select id="pausaEcc"><option value="1">0</option><option value="2">1</option></select>
  </div>

  <div class="timer-card">
    Tiempo de Descanso: <span id="minutos">0</span>:<span id="segundos">00</span>
  </div>

  <div class="form-group">
    <label>Cálculo de Carga (% RM):</label>
    <div class="calc-row">
      <input type="text" id="rmRef" readonly style="width: 60px;" placeholder="RM">
      <span>Kg</span>
      <div class="slider-container" style="flex:1;">
        <input type="range" id="slider1" min="0" max="100" value="50">
        <input type="text" id="percentage" readonly>
      </div>
      <input type="text" id="rmResultKg" readonly style="width: 70px;" placeholder="Total">
    </div>
  </div>

  <hr>

  <div class="grid-header">
    <div>Set</div>
    <div>Nº</div>
    <div>Kg</div>
    <div>Int</div>
    <div>Reps</div>
    <div>RIR</div>
    <div>R'</div>
    <div>RM</div>
  </div>
  <div id="seriesContainer"></div>

  <div class="form-group" style="margin-top: 10px;">
    <label for="textBox1">Observaciones:</label>
    <input type="text" id="textBox1">
  </div>

  <div class="button-group">
    <button id="enviar">Enviar Registro</button>
    <div class="button-group-inline">
        <button id="nuevoEjercicio" class="btn-secundario">Nuevo Ejercicio</button>
        <button id="fin">Finalizar el entrenamiento</button>
    </div>
  </div>

  <div id="label12"></div>
  <div id="label32"></div>
</div>

<script src="EntrenamientoFuerza.js"></script>
</body>
</html>
