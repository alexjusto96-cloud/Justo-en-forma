<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Sesión</title>

  <style>
    /* ==========================================
        VARIABLES Y CONFIGURACIÓN GLOBAL
        ========================================== */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ==========================================
        CONTENEDOR PRINCIPAL
        ========================================== */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      text-align: center;
    }

    /* ==========================================
        FORMULARIO E INPUTS
        ========================================== */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    label {
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input, 
    select, 
    textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, 
    select:focus, 
    textarea:focus {
      border-color: var(--primary);
    }

    /* Estilo auxiliar para los sub-elementos de tipo */
    .sub-input {
      margin-bottom: 8px;
    }

    /* Grupo de tiempo / campos dobles (CORREGIDO) */
    .time-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .time-group input {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    /* ==========================================
        ESTILOS ADAPTADOS PARA VBT Y CARGA
        ========================================== */
    .vbt-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Rejilla adaptativa para los campos de VBT (Con, P.Con, Exc, P.Exc con label encima) */
    .vbt-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
    }

    @media (min-width: 380px) {
      .vbt-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .vbt-item {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
    }

    .vbt-item select {
      padding: 6px 4px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* Controles compactos para Cálculo de Carga */
    .carga-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .carga-controls button {
      width: auto;
      margin-top: 0;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .carga-controls input[type="range"] {
      flex: 1;
      min-width: 0;
    }

    .carga-controls input[type="text"] {
      width: 65px;
      padding: 8px 4px;
      text-align: center;
      font-size: 0.9rem;
    }

    /* ==========================================
        BOTÓN Y MENSAJES DE ESTADO
        ========================================== */
    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    /* Clases de utilidad */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <main class="container">
    <h2>Registro de Sesión</h2>

    <form id="rpeForm">
      
      <!-- Modalidad (Solo Cardio) -->
      <div id="grp-modalidad" class="form-group hidden">
        <label for="modalidad">Modalidad</label>
        <select id="modalidad">
          <!-- Opciones dinámicas cargadas desde JS -->
        </select>
      </div>

      <!-- Tipo de Entrenamiento / Bloque -->
      <div id="grp-tipo" class="form-group hidden">
        <label id="lbl-tipo" for="tipo">Tipo de Entrenamiento</label>
        
        <!-- 1. Buscador del ListPicker -->
        <input type="text" id="search-tipo" class="sub-input" placeholder="🔍 Buscar entrenamiento...">
        
        <!-- 2. Catálogo de opciones desplegado -->
        <select id="tipo" size="5" class="sub-input"></select>
        
        <!-- 3. Campo de texto final -->
        <label for="tipo-texto" style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Valor que se registrará:</label>
        <input type="text" id="tipo-texto" placeholder="Escribe o selecciona un entrenamiento">
      </div>

      <!-- Kilometraje -->
      <div id="grp-kilometraje" class="form-group hidden">
        <label id="lbl-kilometraje" for="kilometraje">Kilometraje (km)</label>
        <input type="text" id="kilometraje" placeholder="Ej: 10,5">
      </div>

      <!-- Pulso Medio -->
      <div id="grp-pulso" class="form-group hidden">
        <label for="pulso">Pulso Medio (ppm)</label>
        <input type="number" id="pulso" placeholder="Ej: 145">
      </div>

      <!-- Intensidad PP (Minutos y Segundos) -->
      <div id="grp-intensidad" class="form-group hidden">
        <label id="lbl-inten">Intensidad PP</label>
        <div class="time-group">
          <input type="number" id="min" placeholder="Min / Watios">
          <span id="delimiter-seg" class="hidden">:</span>
          <input type="number" id="seg" class="hidden" placeholder="Seg">
        </div>
      </div>

      <!-- EJEMPLO / INTEGRACIÓN VBT ADAPTADA -->
      <div class="form-group">
        <div class="vbt-row">
          <input type="checkbox" id="vbt-check" style="width: auto; margin: 0;">
          <label for="vbt-check" style="margin-bottom: 0;">VBT</label>
        </div>
        <div class="vbt-grid">
          <div class="vbt-item">
            <label>Con</label>
            <select id="vbt-con">
              <option>1</option><option>2</option>
            </select>
          </div>
          <div class="vbt-item">
            <label>P.Con</label>
            <select id="vbt-pcon">
              <option>0</option><option>1</option>
            </select>
          </div>
          <div class="vbt-item">
            <label>Exc</label>
            <select id="vbt-exc">
              <option>2</option><option>3</option>
            </select>
          </div>
          <div class="vbt-item">
            <label>P.Exc</label>
            <select id="vbt-pexc">
              <option>0</option><option>1</option>
            </select>
          </div>
        </div>
      </div>

      <!-- EJEMPLO / CÁLCULO DE CARGA ADAPTADO -->
      <div class="form-group">
        <label>Cálculo de Carga (% RM):</label>
        <div class="carga-controls">
          <button type="button" id="btn-rm">RM</button>
          <input type="range" id="range-carga" min="0" max="100" value="100">
          <input type="text" id="text-carga" value="100%">
          <button type="button" id="btn-total">Total</button>
        </div>
      </div>

      <!-- Comentarios Opcionales -->
      <div class="form-group">
        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios" rows="3" placeholder="Sensaciones, observaciones..."></textarea>
      </div>

      <button type="submit" id="btnEnviar">Enviar Registro</button>
    </form>
    
    <div id="statusMessage"></div>
  </main>

  <script src="rpe2.js"></script>
</body>
</html>
