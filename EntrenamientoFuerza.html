<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenamiento Fuerza</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    /* Botones */
    button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    button:active {
      background-color: #2980b9;
    }
    button#fin {
      background-color: #e74c3c;
    }
    button#fin:active {
      background-color: #c0392b;
    }
    .btn-secundario {
      background-color: #ecf0f1;
      color: #2c3e50;
      border: 1px solid #bdc3c7;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .nav-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .nav-banner button {
      padding: 6px 12px;
    }
    #navTextDisplay {
      font-size: 14px;
      font-weight: bold;
      color: #2c3e50;
    }

    /* Tempo compacto para que quepa en una sola línea */
    .tempo-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: #fafafa;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      justify-content: space-between;
    }
    .tempo-inline select {
      width: 42px;
      padding: 3px;
      font-size: 11px;
    }
    .checkbox-inline {
      margin-bottom: 0;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timer-card {
      background: #eef2f5;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      color: #2c3e50;
      margin: 15px 0;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-container input[type="range"] {
      flex: 1;
    }
    .slider-container input[type="text"] {
      width: 55px;
      text-align: center;
    }

    .calc-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* Estilos para las filas de series generadas por JS */
    .serie-row {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 6px;
    }
    .serie-row.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .grid-8col {
      display: grid;
      grid-template-columns: 28px 26px 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 3px;
      align-items: center;
      font-size: 11px;
    }
    .grid-8col input[type="text"] {
      padding: 3px;
      font-size: 11px;
      text-align: center;
    }
    .grid-header {
      display: grid;
      grid-template-columns: 28px 26px 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 3px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }
    .button-group-inline {
      display: flex;
      gap: 8px;
    }
    .button-group-inline button {
      flex: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Registro de Entrenamiento de Fuerza</h2>

  <!-- 1. Selección de Ejercicio -->
  <div class="form-group">
    <label for="listPicker1">Seleccionar ejercicio:</label>
    <select id="listPicker1"></select>
  </div>

  <!-- TextBox editable para el ejercicio -->
  <div class="form-group">
    <label for="ejercicio">Ejercicio:</label>
    <input type="text" id="ejercicio" placeholder="Nombre del ejercicio">
  </div>

  <!-- 2. Navegación de Texto (Flechas) -->
  <div class="nav-banner">
    <button id="btnTextPrev" class="btn-secundario">&larr;</button>
    <span id="navTextDisplay">Texto 1 de 3</span>
    <button id="btnTextNext" class="btn-secundario">&rarr;</button>
  </div>

  <!-- 3. Botón Consultar -->
  <div class="form-group">
    <button id="consultar" style="width: 100%;" class="btn-secundario">Consultar últimos entrenamientos</button>
  </div>

  <!-- 4. VBT y Tempo -->
  <div class="form-group tempo-inline">
    <label class="checkbox-inline">
      <input type="checkbox" id="vbt"> VBT
    </label>
    <span>Tempo:</span>
    <span>Con</span><select id="con"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    <span>P.Con</span><select id="pausaCon"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    <span>Exc</span><select id="ecc"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
    <span>P.Exc</span><select id="pausaEcc"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
  </div>

  <!-- 5. Temporizador de Descanso -->
  <div class="timer-card">
    Tiempo de Descanso: <span id="minutos">0</span>:<span id="segundos">00</span>
  </div>

  <!-- 6. Cálculo de Carga -->
  <div class="form-group">
    <label>Cálculo de Carga (% RM):</label>
    <div class="calc-row">
      <input type="text" id="rmRef" readonly style="width: 60px;" placeholder="RM">
      <span>Kg</span>
      <div class="slider-container" style="flex:1;">
        <input type="range" id="slider1" min="0" max="100" value="50">
        <input type="text" id="percentage" readonly>
      </div>
      <input type="text" id="rmResultKg" readonly style="width: 70px;" placeholder="Total">
    </div>
  </div>

  <hr>

  <!-- 7. Cabecera y Contenedor de Series -->
  <div class="grid-header">
    <div>Set</div>
    <div>Nº</div>
    <div>Kg</div>
    <div>Int</div>
    <div>Reps</div>
    <div>RIR</div>
    <div>R'</div>
    <div>RM</div>
  </div>
  <div id="seriesContainer"></div>

  <!-- 8. Observaciones -->
  <div class="form-group" style="margin-top: 10px;">
    <label for="textBox1">Observaciones:</label>
    <input type="text" id="textBox1">
  </div>

  <!-- 9. Botones de Acción -->
  <div class="button-group">
    <button id="enviar">Enviar Registro</button>
    <div class="button-group-inline">
        <button id="nuevoEjercicio" class="btn-secundario">Nuevo Ejercicio</button>
        <button id="fin">Finalizar el entrenamiento</button>
    </div>
  </div>

  <div id="label12"></div>
  <div id="label32"></div>
</div>

<script src="EntrenamientoFuerza.js"></script>
</body>
</html>
