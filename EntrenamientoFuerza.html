<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenamiento Fuerza</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
    }
    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    input.disabled-input, input:disabled, input[readonly]:not(#percentage):not(#rmResultKg) {
      background-color: #e9ecef !important;
      color: #6c757d !important;
      opacity: 1 !important;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #3498db;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    button:active {
      background-color: #2980b9;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button#fin {
      background-color: #e74c3c;
    }
    button#fin:active {
      background-color: #c0392b;
    }
    .btn-secundario {
      background-color: #ecf0f1;
      color: #2c3e50;
      border: 1px solid #bdc3c7;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .nav-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .nav-banner button {
      padding: 6px 12px;
    }
    #navTextDisplay {
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
      text-align: center;
      flex: 1;
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* MEJORA: Bloque de Tempo rediseñado en Grid */
    .tempo-card {
      background: #fafafa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      font-size: 12px;
    }
    .tempo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .tempo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }
    .tempo-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tempo-item span {
      font-size: 10px;
      color: #555;
      font-weight: bold;
    }
    .tempo-item select {
      width: 100%;
      padding: 4px;
      font-size: 12px;
      text-align: center;
    }

    .timer-card {
      background: #eef2f5;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      color: #2c3e50;
      margin: 15px 0;
    }

    /* MEJORA: Cálculo de Carga optimizado y limpio */
    .calc-card {
      background: #fafafa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    .calc-inputs-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .slider-container input[type="range"] {
      flex: 1;
    }
    .slider-container input[type="text"] {
      width: 50px;
      text-align: center;
    }
    .calc-results-bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }
    .calc-field {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .calc-field input {
      text-align: center;
    }

    .serie-row {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      padding: 8px;
      margin-bottom: 6px;
      border-radius: 6px;
    }
    .serie-row.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .grid-8col {
      display: grid;
      grid-template-columns: 28px 26px 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 3px;
      align-items: center;
      font-size: 11px;
    }
    .grid-8col input[type="text"] {
      padding: 3px;
      font-size: 11px;
      text-align: center;
    }
    .grid-header {
      display: grid;
      grid-template-columns: 28px 26px 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 3px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }
    .button-group-inline {
      display: flex;
      gap: 8px;
    }
    .button-group-inline button {
      flex: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <button id="btnVolverMenu" class="back-btn">&larr;</button>
  <h2>Registro de Entrenamiento de Fuerza</h2>

  <div class="form-group">
    <label for="listPicker1">Seleccionar ejercicio:</label>
    <input type="text" id="buscadorEjercicio" placeholder="Buscar ejercicio..." style="margin-bottom: 6px;">
    <select id="listPicker1"></select>
  </div>

  <div class="form-group">
    <label for="ejercicio">Ejercicio:</label>
    <input type="text" id="ejercicio" placeholder="Nombre del ejercicio">
  </div>

  <div class="form-group">
    <button id="consultar" style="width: 100%;" class="btn-secundario">Consultar últimos entrenamientos</button>
  </div>

  <div class="nav-banner">
    <button id="btnTextPrev" class="btn-secundario">&larr;</button>
    <span id="navTextDisplay"></span>
    <button id="btnTextNext" class="btn-secundario">&rarr;</button>
  </div>

  <!-- MEJORA: Estructura visual clara para Tempo y VBT -->
  <div class="form-group tempo-card">
    <div class="tempo-header">
      <label class="checkbox-inline" style="margin:0;">
        <input type="checkbox" id="vbt"> Modo VBT
      </label>
      <span style="font-size: 11px; color: #666;">Configuración de Tempo</span>
    </div>
    <div class="tempo-grid">
      <div class="tempo-item">
        <span>Con</span>
        <select id="con"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
      </div>
      <div class="tempo-item">
        <span>P.Con</span>
        <select id="pausaCon"><option value="1">0</option><option value="2">1</option></select>
      </div>
      <div class="tempo-item">
        <span>Exc</span>
        <select id="ecc"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
      </div>
      <div class="tempo-item">
        <span>P.Exc</span>
        <select id="pausaEcc"><option value="1">0</option><option value="2">1</option></select>
      </div>
    </div>
  </div>

  <div class="timer-card">
    Tiempo de Descanso: <span id="minutos">0</span>:<span id="segundos">00</span>
  </div>

  <!-- MEJORA: Bloque de Carga (% RM) más ordenado y compacto -->
  <div class="form-group calc-card">
    <label style="margin-bottom: 6px;">Cálculo de Carga (% RM):</label>
    <div class="calc-inputs-top">
      <div class="slider-container">
        <input type="range" id="slider1" min="0" max="100" value="50">
        <input type="text" id="percentage" readonly>
      </div>
    </div>
    <div class="calc-results-bottom">
      <div class="calc-field">
        <span style="font-size:11px; font-weight:bold;">RM Ref:</span>
        <input type="text" id="rmRef" readonly placeholder="RM"> <span style="font-size:11px;">Kg</span>
      </div>
      <div class="calc-field" style="justify-content: flex-end;">
        <span style="font-size:11px; font-weight:bold;">Total:</span>
        <input type="text" id="rmResultKg" readonly placeholder="Total"> <span style="font-size:11px;">Kg</span>
      </div>
    </div>
  </div>

  <hr>

  <div class="grid-header">
    <div>Set</div>
    <div>Nº</div>
    <div>Kg</div>
    <div>Int</div>
    <div>Reps</div>
    <div>RIR</div>
    <div>R'</div>
    <div>RM</div>
  </div>
  <div id="seriesContainer"></div>

  <div class="form-group" style="margin-top: 10px;">
    <label for="textBox1">Observaciones:</label>
    <input type="text" id="textBox1">
  </div>

  <div class="button-group">
    <button id="enviar">Enviar Registro</button>
    <div class="button-group-inline">
        <button id="nuevoEjercicio" class="btn-secundario">Nuevo Ejercicio</button>
        <button id="fin">Finalizar el entrenamiento</button>
    </div>
  </div>

  <div id="label12"></div>
  <div id="label32"></div>
</div>

<script src="EntrenamientoFuerza.js"></script>
</body>
</html>
