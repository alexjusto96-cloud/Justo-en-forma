<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Test</title>
    <link rel="stylesheet" href="style.css"> <!-- O tus estilos incorporados -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        input.error, select.error { border-color: #ff0000; background-color: #fff0f0; }
        .row { display: flex; gap: 10px; }
        .row select { flex: 1; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-menu { background-color: #6c757d; margin-top: 5px; }
        .btn-menu:hover { background-color: #5a6268; }
        #loading-spinner { text-align: center; font-style: italic; color: #666; margin-bottom: 15px; }
        .hidden { display: none; }
        #notificador-lbl { margin-top: 15px; text-align: center; font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-spinner" class="hidden">Cargando...</div>

    <div class="form-group">
        <label for="nombre">Usuario</label>
        <input type="text" id="nombre" readonly>
    </div>

    <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
    </div>

    <div class="form-group">
        <label>Test</label>
        <div class="row">
            <select id="unimulti">
                <option value="" disabled selected>Selecciona tipo</option>
                <option value="Bilateral">Bilateral</option>
                <option value="Unilateral">Unilateral</option>
            </select>
            <select id="lateralidad" class="hidden" disabled>
                <option value="" disabled selected>Lateralidad</option>
                <option value="IZQ">IZQ</option>
                <option value="DCH">DCH</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <select id="test-select" disabled>
            <option value="" disabled selected>Selecciona el Test</option>
        </select>
    </div>

    <div class="form-group">
        <label for="resultado">Resultado</label>
        <input type="number" id="resultado" placeholder="Ingresa el resultado">
    </div>

    <div class="form-group">
        <label for="observaciones">Observaciones</label>
        <input type="text" id="observaciones" placeholder="Observaciones">
    </div>

    <button id="enviar">Registrar</button>
    <div id="notificador-lbl"></div>
    <button id="btn-menu" class="btn-menu">Menú principal</button>
</div>

<script src="Test_registro.js"></script>
</body>
</html>
