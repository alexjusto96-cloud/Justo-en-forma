<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justo en Forma</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
</head>
<body>
  <header class="app-header">
    <h1>Justo en Forma</h1>
  </header>

  <main id="app-container" class="main-content">
    <div class="card">
      <h2>Estructura PWA Lista</h2>
      <p>Envía la primera pantalla o bloques de App Inventor para construir la interfaz aquí.</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registrado'))
        .catch(err => console.error('Error en Service Worker:', err));
    }
  </script>
</body>
</html>
