<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justo en Forma</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
</head>
<body>
  <header class="app-header">
    <h1>Justo en Forma</h1>
  </header>

  <main id="app-container" class="main-content">
    <div class="card login-card">
      <div class="logo-container">
        <!-- Imagen de icono -->
        <img src="icon-192.png" alt="Justo en Forma Logo" class="app-logo">
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
        </div>

        <div class="form-checkbox">
          <input type="checkbox" id="remember-me" checked>
          <label for="remember-me">Recuérdame</label>
        </div>

        <button type="submit" id="btn-enviar" class="btn-primary">Enviar</button>
      </form>

      <!-- Mensaje de Notificación/Alerta -->
      <div id="notification" class="notification hidden"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registrado'))
        .catch(err => console.error('Error en Service Worker:', err));
    }
  </script>
</body>
</html>
