<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal - Justo en Forma</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
</head>
<body>
  <header class="app-header">
    <h1>Menú Principal</h1>
    <span id="user-greeting" class="user-badge"></span>
  </header>

  <main class="main-content">
    <div class="card menu-card">
      <div class="menu-grid">
        <button id="btn-rpe" class="btn-menu">RPE</button>
        <button id="btn-readiness" class="btn-menu">Readiness</button>
        <button id="btn-perfil-fv" class="btn-menu">Perfil FV</button>
        <button id="btn-performance" class="btn-menu">Grabar performance</button>
        <button id="btn-entrenamiento-fuerza" class="btn-menu">Entrenamiento de fuerza</button>
        <button id="btn-registrar-test" class="btn-menu">Registrar tests</button>
        <button id="btn-consultar-test" class="btn-menu">Consultar test</button>
      </div>

      <div class="menu-footer">
        <button id="btn-logout" class="btn-secondary">Cerrar sesión</button>
      </div>

      <div class="logo-container margin-top">
        <img src="icon-192.png" alt="Deportes" class="app-logo" style="width: 160px; max-width: 100%; height: auto; display: block; margin: 0 auto 1.5rem auto;">
      </div>
    </div>
  </main>

  <script src="menu_principal.js"></script>
</body>
</html>
